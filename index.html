<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Day Cebu 2026 · Rail-Flow × Amihan Solutions × Aurizon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --rf-dark:   #0b3424;
      --rf-mid:    #1a6e3c;
      --rf-light:  #9dc291;
      --am-dark:   #1C4485;
      --am-mid:    #0056A7;
      --am-light:  #4a9fe0;
      --au-dark:   #b84800;
      --au-mid:    #e85d04;
      --au-light:  #ff9a5c;
      --bg-base:   #070d16;
      --bg-surface:#0c1520;
      --text:      #f0f4f8;
      --muted:     #8a9ab0;
      --footer-h:  64px;
      --header-h:  6px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ── Progress bar ── */
    #progressBar {
      position: fixed;
      top: 0; left: 0;
      height: var(--header-h);
      background: linear-gradient(90deg, var(--au-mid) 0%, var(--rf-mid) 50%, var(--am-mid) 100%);
      transition: width 0.45s cubic-bezier(.4,0,.2,1);
      z-index: 300;
    }

    /* ── Slide container ── */
    #slidesContainer {
      position: fixed;
      top: var(--header-h);
      left: 0; right: 0;
      bottom: var(--footer-h);
    }

    /* ── Slides ── */
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 56px 96px;
      text-align: center;
      opacity: 0;
      transform: translateX(70px);
      transition: opacity 0.38s ease, transform 0.38s ease;
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: all;
    }
    .slide.exit {
      opacity: 0;
      transform: translateX(-70px);
    }

    /* ── Background variants ── */
    .bg-welcome {
      background:
        radial-gradient(ellipse 55% 50% at 15% 50%, rgba(232,93,4,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 55% 50% at 85% 50%, rgba(0,86,167,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 40% 60% at 50% 50%, rgba(26,110,60,0.08) 0%, transparent 70%),
        var(--bg-base);
    }
    .bg-agenda { background: var(--bg-surface); }

    .bg-h1 {
      background: linear-gradient(135deg, #1a0400 0%, #5c1a00 40%, var(--au-mid) 100%);
    }
    .bg-h2 {
      background: linear-gradient(135deg, #020f08 0%, #06331a 40%, var(--rf-mid) 100%);
    }
    .bg-h3 {
      background: linear-gradient(135deg, #020f28 0%, #041e5c 40%, var(--am-mid) 100%);
    }
    .bg-h4 {
      background: linear-gradient(135deg, #0a0418 0%, #1e0a45 40%, #3d1a90 100%);
    }

    .bg-q1  { background: radial-gradient(ellipse at 50% 40%, rgba(232,93,4,0.13) 0%, var(--bg-base) 65%); }
    .bg-q2  { background: radial-gradient(ellipse at 50% 40%, rgba(26,110,60,0.12) 0%, var(--bg-base) 65%); }
    .bg-q3  { background: radial-gradient(ellipse at 50% 40%, rgba(0,86,167,0.12) 0%, var(--bg-base) 65%); }
    .bg-q4  { background: radial-gradient(ellipse at 50% 40%, rgba(61,26,144,0.15) 0%, var(--bg-base) 65%); }
    .bg-demo { background: radial-gradient(ellipse at 50% 35%, rgba(232,93,4,0.10) 0%, var(--bg-base) 65%); }
    .bg-break { background: radial-gradient(ellipse at 50% 40%, rgba(180,130,0,0.12) 0%, var(--bg-base) 65%); }
    .bg-hack { background: linear-gradient(135deg, #010c1e 0%, #022050 50%, #043775 100%); }
    .bg-hack-q { background: radial-gradient(ellipse at 50% 35%, rgba(10,70,160,0.18) 0%, var(--bg-base) 65%); }

    /* ── Deco line ── */
    .deco-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--au-light), var(--rf-light), var(--am-light));
      opacity: 0.5;
    }

    /* ── Typography ── */
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 16px;
    }
    .eyebrow.c1 { color: var(--au-light); opacity: 0.8; }
    .eyebrow.c2 { color: var(--rf-light); opacity: 0.8; }
    .eyebrow.c3 { color: var(--am-light); opacity: 0.8; }
    .eyebrow.c4 { color: #b39ddb; opacity: 0.8; }

    .main-title {
      font-size: 3.8rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .subtitle {
      font-size: 1.35rem;
      font-weight: 400;
      opacity: 0.65;
      max-width: 680px;
      line-height: 1.6;
    }

    .title-rule {
      width: 60px;
      height: 3px;
      border-radius: 2px;
      margin: 0 auto 24px;
      background: linear-gradient(90deg, var(--au-light), var(--rf-light), var(--am-light));
    }

    /* ── Question layout ── */
    .q-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 36px;
      border: 1px solid;
    }
    .qb-1 { border-color: rgba(255,154,92,0.4); color: var(--au-light); }
    .qb-2 { border-color: rgba(157,194,145,0.4); color: var(--rf-light); }
    .qb-3 { border-color: rgba(74,159,224,0.4); color: var(--am-light); }
    .qb-4 { border-color: rgba(179,157,219,0.4); color: #b39ddb; }

    .q-text {
      font-size: 2.9rem;
      font-weight: 700;
      line-height: 1.2;
      max-width: 920px;
      letter-spacing: -0.01em;
    }
    .q-hint {
      font-size: 0.9rem;
      opacity: 0.35;
      margin-top: 32px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    /* Colored spans */
    .c1 { color: var(--au-light); }
    .c2 { color: var(--rf-light); }
    .c3 { color: var(--am-light); }
    .c4 { color: #b39ddb; }
    .cgold { color: #f0c040; }

    /* ── Info box ── */
    .info-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 28px 40px;
      max-width: 740px;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-top: 28px;
      text-align: left;
    }
    .info-box .row { display: flex; align-items: flex-start; gap: 12px; padding: 4px 0; }

    /* ── Agenda list ── */
    .agenda-wrap {
      text-align: left;
      width: 100%;
      max-width: 680px;
    }
    .a-row {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 1.05rem;
    }
    .a-row:last-child { border-bottom: none; }
    .a-time {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      min-width: 56px;
      letter-spacing: 0.04em;
    }
    .a-act { font-weight: 500; }
    .a-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-rf  { background: var(--rf-light); }
    .dot-am  { background: var(--am-light); }
    .dot-au  { background: var(--au-light); }
    .dot-mix { background: linear-gradient(135deg, var(--au-light), var(--rf-light)); }
    .dot-brk { background: #f0c040; }

    /* ── Bullet list ── */
    .bullet-list {
      list-style: none;
      text-align: left;
      max-width: 680px;
      width: 100%;
    }
    .bullet-list li {
      padding: 10px 0 10px 28px;
      font-size: 1.1rem;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      line-height: 1.5;
    }
    .bullet-list li:last-child { border-bottom: none; }
    .bullet-list li::before { content: '→'; position: absolute; left: 0; opacity: 0.35; }

    /* ── Big emoji ── */
    .big-emoji { font-size: 5rem; margin-bottom: 24px; line-height: 1; }

    /* ── Tag strip ── */
    .tag-strip {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tag {
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .tag-rf { border-color: rgba(157,194,145,0.5); color: var(--rf-light); }
    .tag-am { border-color: rgba(74,159,224,0.5); color: var(--am-light); }
    .tag-au { border-color: rgba(232,93,4,0.5); color: var(--au-light); }

    /* ── Train illustration ── */
    .train-wrap {
      margin: 24px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .train-svg {
      width: 320px;
      height: 80px;
      opacity: 0.85;
    }

    /* ── Aurizon logo badge ── */
    .aurizon-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(232,93,4,0.12);
      border: 1px solid rgba(232,93,4,0.35);
      border-radius: 10px;
      padding: 8px 20px;
      margin-top: 16px;
    }
    .aurizon-badge .au-logo-text {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--au-light);
    }

    /* ── Footer ── */
    #footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--footer-h);
      background: rgba(7,13,22,0.95);
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 300;
      backdrop-filter: blur(12px);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .logo-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
    }
    .logo-pill img {
      height: 22px;
      width: auto;
      object-fit: contain;
    }
    .logo-rf img  { filter: brightness(0) invert(1); }
    .logo-am img  { filter: brightness(0) invert(1); }
    .logo-au-pill {
      background: white;
      border: 1px solid rgba(232,93,4,0.3);
      border-radius: 8px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
    }
    .logo-au-text {
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--au-light);
    }

    /* ── Photo layouts ── */
    .photo-strip {
      display: flex;
      gap: 8px;
      margin: 14px 0 10px;
      justify-content: center;
    }
    .photo-strip img {
      height: 76px;
      width: 106px;
      object-fit: cover;
      border-radius: 8px;
      opacity: 0.78;
      border: 1px solid rgba(255,255,255,0.12);
      transition: opacity 0.2s;
    }
    .photo-strip img:hover { opacity: 1; }
    .photo-strip-label {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.3;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .aurizon-hero {
      width: 100%;
      max-width: 580px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      margin: 10px 0 6px;
      opacity: 0.82;
      border: 1px solid rgba(232,93,4,0.2);
    }
    .manila-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 820px;
      width: 100%;
      margin: 18px 0 6px;
    }
    .manila-grid img {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      opacity: 0.8;
    }
    .au-photo-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      max-width: 820px;
      width: 100%;
    }
    .au-photo-row img {
      flex: 1;
      height: 140px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(232,93,4,0.2);
      opacity: 0.78;
    }

    .logo-sep {
      font-size: 0.65rem;
      color: var(--muted);
      padding: 0 8px;
      letter-spacing: 0.05em;
    }

    .footer-center {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .nav-btn {
      width: 38px; height: 38px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.25);
    }
    .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }

    #slideCounter {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-width: 52px;
      text-align: center;
    }

    .footer-right {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    #activityBadge {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Col info ── */
    .col-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      max-width: 880px;
      width: 100%;
      margin-top: 22px;
      text-align: left;
    }
    .col-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 20px 22px;
    }
    .col-title {
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0.4; margin-bottom: 12px;
    }
    .col-box ul { list-style: none; padding: 0; }
    .col-box ul li {
      font-size: 0.92rem;
      padding: 5px 0 5px 20px;
      position: relative; line-height: 1.45;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .col-box ul li:last-child { border-bottom: none; }
    .col-box ul li::before { content: '→'; position: absolute; left: 0; opacity: 0.25; }

    /* ── Steps list ── */
    .steps-list {
      list-style: none;
      text-align: left;
      max-width: 700px;
      width: 100%;
      counter-reset: step-counter;
    }
    .steps-list li {
      counter-increment: step-counter;
      padding: 11px 0 11px 50px;
      font-size: 1rem;
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      line-height: 1.5;
    }
    .steps-list li:last-child { border-bottom: none; }
    .steps-list li::before {
      content: counter(step-counter);
      position: absolute; left: 0; top: 10px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(232,93,4,0.2);
      border: 1px solid rgba(255,154,92,0.35);
      color: var(--au-light);
      font-size: 0.78rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── This or That choice layout ── */
    .tot-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      max-width: 860px;
      width: 100%;
      margin-top: 20px;
    }
    .tot-option {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .tot-option.left  { border-color: rgba(232,93,4,0.35); color: var(--au-light); }
    .tot-option.right { border-color: rgba(157,194,145,0.35); color: var(--rf-light); }
    .tot-vs {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--muted);
      letter-spacing: 0.2em;
    }

    /* ── Demo card ── */
    .demo-box {
      background: rgba(232,93,4,0.06);
      border: 1px solid rgba(232,93,4,0.2);
      border-radius: 14px;
      padding: 28px 40px;
      max-width: 760px;
      text-align: left;
      margin-top: 24px;
    }
    .demo-box .row { display: flex; align-items: flex-start; gap: 14px; padding: 8px 0; font-size: 1.05rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .demo-box .row:last-child { border-bottom: none; }

    /* ── Challenge card grid ── */
    .challenge-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin-top: 24px;
    }
    .challenge-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 22px 26px;
      text-align: left;
    }
    .challenge-card.ca { border-left: 3px solid var(--au-light); }
    .challenge-card.cb { border-left: 3px solid var(--rf-light); }
    .challenge-card.cc { border-left: 3px solid var(--am-light); }
    .card-tag {
      display: inline-block;
      font-size: 0.63rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 10px; margin-bottom: 10px;
    }
    .tag-together { background: rgba(255,154,92,0.12); color: var(--au-light); border: 1px solid rgba(255,154,92,0.3); }
    .tag-challenge { background: rgba(157,194,145,0.12); color: var(--rf-light); border: 1px solid rgba(157,194,145,0.3); }
    .tag-bonus     { background: rgba(74,159,224,0.12); color: var(--am-light); border: 1px solid rgba(74,159,224,0.3); }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .card-desc  { font-size: 0.85rem; opacity: 0.55; line-height: 1.5; }

    /* ── keyboard hint ── */
    #kbHint {
      position: fixed;
      top: 20px; right: 24px;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.06em;
      z-index: 400;
    }

    /* ── People cards ── */
    .people-row {
      display: flex;
      gap: 20px;
      margin-top: 24px;
      justify-content: center;
    }
    .person-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 20px 28px;
      text-align: center;
      min-width: 160px;
    }
    .person-avatar { font-size: 2.8rem; margin-bottom: 10px; display: block; }
    .person-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .person-role { font-size: 0.75rem; opacity: 0.4; letter-spacing: 0.06em; text-transform: uppercase; }

    /* Timer circle */
    .timer-circle {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.08);
      background: rgba(232,93,4,0.1);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
      margin: 0 auto 20px;
    }
    .timer-num { font-size: 2.4rem; font-weight: 800; color: var(--au-light); line-height: 1; }
    .timer-label { font-size: 0.7rem; opacity: 0.4; letter-spacing: 0.1em; text-transform: uppercase; }
  </style>
</head>
<body>

<div id="progressBar" style="width:0%"></div>
<div id="kbHint">← → ARROW KEYS</div>
<div id="slidesContainer"></div>

<!-- Footer with logos + nav -->
<div id="footer">
  <div class="logo-group">
    <div class="logo-pill logo-rf">
      <img src="https://www.rail-flow.com/wp-content/uploads/2023/09/Rail-Flow-custom-navbar-logo.svg"
           alt="Rail-Flow"
           onerror="this.parentNode.innerHTML='<span style=\'font-size:0.8rem;font-weight:700;color:#9dc291;letter-spacing:0.05em\'>RAIL-FLOW</span>'">
    </div>
    <span class="logo-sep">×</span>
    <div class="logo-pill logo-am">
      <img src="https://amihansolutions.com/wp-content/uploads/2025/06/Layer-1.png"
           alt="Amihan Solutions"

// NAVIGATION
// ═══════════════════════════════════════════════════════════
let current = 0;
let animating = false;

function renderSlide(idx) {
  if (animating) return;
  animating = true;

  const container = document.getElementById('slidesContainer');
  const total = slides.length;
  const s = slides[idx];

  const old = container.querySelector('.slide.active');
  if (old) {
    old.classList.add('exit');
    old.classList.remove('active');
    setTimeout(() => { if (old.parentNode) old.remove(); }, 380);
  }

  const el = document.createElement('div');
  el.className = `slide ${s.bg}`;
  el.innerHTML = s.html;
  container.appendChild(el);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add('active');
    animating = false;
  }));

  const pct = ((idx + 1) / total * 100).toFixed(1);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('slideCounter').textContent = `${idx + 1} / ${total}`;
  document.getElementById('activityBadge').textContent = s.badge || '';

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === total - 1;
}

function go(dir) {
  const next = current + dir;
  if (next < 0 || next >= slides.length || animating) return;
  current = next;
  renderSlide(current);
}

document.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft', 'ArrowUp'].includes(e.key))          { e.preventDefault(); go(-1); }
});

renderSlide(0);
</script>
